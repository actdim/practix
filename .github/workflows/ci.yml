name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore ActDim.Practix.sln

      - name: Build solution
        run: dotnet build ActDim.Practix.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test ActDim.Practix.sln --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage"
